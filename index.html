<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WobePages Service</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 30px; height: 30px; animation: spin 2s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #status { text-align: center; }
    </style>
</head>
<body>
    <div id="status">
        <div class="loader" id="spinner"></div>
        <p id="msg">Conectando con la instancia Git...</p>
    </div>

    <script>
        // --- CONFIGURACIÓN DE USUARIO ---
        const CONFIG = {
            domain: "wobepages.qzz.io",       // Tu dominio en el que se subiran las páginas
            instance: "https://git.wobe.qzz.io", // Tu instancia Gitea/Forgejo
            token: "no",                      // Pon tu token aquí o "no" para que solo se publiquen repos públicos
            mode: "sub"                       // "sub" (user.dom/repo) o "slash" (dom/user/repo)
        };

        async function init() {
            const path = window.location.pathname;
            const hostname = window.location.hostname;
            let user = "", repo = "", branch = "pages", filePath = "index.html";

            // 1. EXTRAER USUARIO Y REPO SEGÚN EL MODO
            if (CONFIG.mode === "sub") {
                user = hostname.split('.')[0];
                const parts = path.split('/').filter(p => p);
                repo = parts[0] || user; // Si no hay repo, asume nombre del usuario
                // Manejo de ramas con @
                if (parts[1] && parts[1].startsWith('@')) branch = parts[1].substring(1);
            } else {
                const parts = path.split('/').filter(p => p);
                user = parts[0];
                repo = parts[1] || user;
                if (parts[2] && parts[2].startsWith('@')) branch = parts[2].substring(1);
            }

            if (!user) {
                document.getElementById('msg').innerText = "Error: Usuario no identificado.";
                return;
            }

            // 2. CONSTRUIR URL DE LA API (Gitea/Forgejo Raw)
            // Formato: /api/v1/repos/{owner}/{repo}/contents/{filepath}?ref={branch}
            const apiUrl = `${CONFIG.instance}/api/v1/repos/${user}/${repo}/contents/${filePath}?ref=${branch}`;
            
            const headers = {};
            if (CONFIG.token !== "no") {
                headers["Authorization"] = `token ${CONFIG.token}`;
            }

            try {
                const response = await fetch(apiUrl, { headers });
                if (!response.ok) throw new Error("Archivo no encontrado o repositorio privado.");
                
                const data = await response.json();
                // El contenido en Gitea API viene en base64
                const content = decodeURIComponent(escape(atob(data.content)));
                
                // Inyectar el contenido en el documento
                document.open();
                document.write(content);
                document.close();
            } catch (err) {
                document.getElementById('spinner').style.display = 'none';
                document.getElementById('msg').innerHTML = `
                    <h3>404 - WobePages</h3>
                    <p>No se pudo cargar el sitio.</p>
                    <small>Busqué: ${user}/${repo} en rama: ${branch}</small>
                `;
            }
        }

        init();
    </script>
</body>
</html>
