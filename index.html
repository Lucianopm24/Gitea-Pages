<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pages</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #7ec87e; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #status { text-align: center; transition: opacity 0.5s; }
    </style>
</head>
<body>
    <div id="status">
        <div class="loader"></div>
        <p>Cargando...</p>
    </div>

    <script>
        const CONFIG = {
            domain: "luciano.qzz.io",
            instance: "https://git.luciano.qzz.io", 
            token: "no", 
            mode: "slash" 
        };

        async function init() {
            const path = window.location.pathname;
            const hostname = window.location.hostname;
            let user = "", repo = "", branch = "pages", filePath = "index.html";

            if (CONFIG.mode === "sub") {
                user = hostname.split('.')[0];
                const parts = path.split('/').filter(p => p);
                repo = parts[0] || "Portafolio"; 
                if (parts[1] && parts[1].startsWith('@')) branch = parts[1].substring(1);
            } else {
                const parts = path.split('/').filter(p => p);
                user = parts[0];
                repo = parts[1];
                if (parts[2] && parts[2].startsWith('@')) branch = parts[2].substring(1);
            }

            const apiUrl = `${CONFIG.instance}/api/v1/repos/${user}/${repo}/contents/${filePath}?ref=${branch}`;
            
            try {
                // Se agregan headers para manejar el token y mejorar la compatibilidad
                const headers = {};
                if (CONFIG.token !== "no") {
                    headers["Authorization"] = `token ${CONFIG.token}`;
                }

                const response = await fetch(apiUrl, { headers });
                if (!response.ok) throw new Error("No se pudo obtener el archivo");
                
                const data = await response.json();

                const rawContent = data.content.replace(/\s/g, ''); 
                const decoded = decodeURIComponent(escape(atob(rawContent)));

                document.open();
                document.write(decoded);
                document.close();

            } catch (err) {
                document.getElementById('status').innerHTML = `<h3>Error al encontrar la página</h3><p>${err.message}</p>`;
            }
        }

        init();
    </script>
</body>
</html>
