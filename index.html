<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pages</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #7ec87e; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #status { text-align: center; transition: opacity 0.5s; }
    </style>
</head>
<body>
    <div id="status">
        <div class="loader"></div>
        <p>Cargando...</p>
    </div>

    <script>
        const CONFIG = {
            domain: "luciano.qzz.io",          // Tu dominio
            instance: "https://git.luciano.qzz.io", // Tu instancia de Gitea/Forgejo
            token: "no",                       // Tu token o "no" para repos públicos
            mode: "slash"                      // "sub" o "slash"
        };

        async function init() {
            const path = window.location.pathname;
            const hostname = window.location.hostname;
            let user = "", repo = "", branch = "pages", filePath = "index.html";

            // Lógica de extracción de URL según tu especificación
            const parts = path.split('/').filter(p => p);

            if (CONFIG.mode === "sub") {
                user = hostname.split('.')[0];
                repo = parts[0] || user; 
                if (parts[1] && parts[1].startsWith('@')) branch = parts[1].substring(1);
            } else {
                user = parts[0];
                repo = parts[1] || user;
                if (parts[2] && parts[2].startsWith('@')) branch = parts[2].substring(1);
            }

            // Estructura de URL RAW: git.dominio.io/USER/REPO/raw/branch/RAMA/ARCHIVO
            const rawUrl = `${CONFIG.instance}/${user}/${repo}/raw/branch/${branch}/${filePath}`;
            
            try {
                const headers = {};
                // RESTAURADO: Sistema de Token para repositorios privados
                if (CONFIG.token !== "no") {
                    headers["Authorization"] = `token ${CONFIG.token}`;
                }

                const response = await fetch(rawUrl, { headers });
                if (!response.ok) throw new Error("No se pudo obtener el archivo (Verifica el Token o si el repo existe)");
                
                const html = await response.text();

                // REEMPLAZO TOTAL DEL DOCUMENTO PARA SERVIR EL SITIO
                document.open();
                document.write(html);
                document.close();

            } catch (err) {
                document.getElementById('status').innerHTML = `<h3>Error al encontrar la página</h3><p>${err.message}</p>`;
            }
        }

        init();
    </script>
</body>
</html>
