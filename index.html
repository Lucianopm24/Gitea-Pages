<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pages</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body.error-view {
    font-family: 'Courier New', monospace;
    background: #0e0e0e;
    color: #e0e0e0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 2rem;
  }

  .error-box {
    max-width: 480px;
    width: 100%;
    border: 1px solid #2a2a2a;
    padding: 2rem 2.5rem;
  }

  .error-box .code {
    font-size: 4rem;
    font-weight: bold;
    color: #fff;
    line-height: 1;
    margin-bottom: 0.4rem;
  }

  .error-box .label {
    font-size: 0.7rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #555;
    margin-bottom: 1.5rem;
  }

  .error-box .message {
    font-size: 0.88rem;
    color: #999;
    line-height: 1.65;
  }

  .error-box .detail {
    margin-top: 1rem;
    font-size: 0.72rem;
    color: #444;
    word-break: break-all;
    line-height: 1.5;
  }
</style>
</head>
<body>
<script>
/* ================================================================
   PAGES — Gitea/Forgejo static hosting via Cloudflare Pages
   ================================================================

   CONFIGURACIÓN — solo edita estas 4 variables:
   ---------------------------------------------------------------- */

const CONFIG = {
  // Tu dominio base (sin trailing slash, sin https://)
  // Ejemplo: "wobepages.qzz.io"
  domain: "wobepages.qzz.io",

  // URL de tu instancia Gitea/Forgejo (sin trailing slash)
  // Ejemplo: "https://git.wobe.qzz.io"
  instance: "https://git.wobe.qzz.io",

  // Token de acceso personal, o "no" para solo repos públicos
  // Se genera en: Configuración → Aplicaciones → Generar token
  token: "no",

  // Modo de URL:
  //   "sub"   → usuario.tudominio/repo
  //   "slash" → tudominio/usuario/repo
  mode: "sub",
};

/* ================================================================
   MOTOR — no tocar a menos que sepas lo que haces
   ================================================================ */

(async () => {
  const host     = location.hostname;
  const pathname = location.pathname;
  const cfgDomain = CONFIG.domain.replace(/^https?:\/\//, "").replace(/\/$/, "");

  // ── 1. Parsear usuario, repo, rama y ruta desde la URL ───────

  let user, repo, branch, filePath;

  if (CONFIG.mode === "sub") {

    if (!host.endsWith(cfgDomain)) return err(400, "Dominio no reconocido", host);

    if (host === cfgDomain) return err(404, "No se especificó un usuario", "Usa usuario." + cfgDomain);

    user = host.slice(0, host.length - cfgDomain.length - 1);

    const parts = pathname.replace(/^\//, "").split("/").filter(Boolean);

    if (parts.length === 0) {
      // usuario.dominio → repo = usuario, rama = pages, archivo = index.html
      repo     = user;
      branch   = "pages";
      filePath = "index.html";
    } else if (parts[0].startsWith("@")) {
      // usuario.dominio/@rama/...
      repo     = user;
      branch   = parts.shift().slice(1);
      filePath = parts.join("/") || "index.html";
    } else {
      // usuario.dominio/repo/@rama/...  o  usuario.dominio/repo/...
      repo = parts.shift();
      if (parts[0] && parts[0].startsWith("@")) {
        branch = parts.shift().slice(1);
      } else {
        branch = "pages";
      }
      filePath = parts.join("/") || "index.html";
    }

  } else {
    // slash mode
    if (host !== cfgDomain) return err(400, "Dominio no reconocido", host);

    const parts = pathname.replace(/^\//, "").split("/").filter(Boolean);

    if (!parts[0]) return err(404, "No se especificó un usuario", pathname);
    user = parts.shift();

    if (!parts[0] || parts[0].startsWith("@")) {
      repo = user;
    } else {
      repo = parts.shift();
    }

    if (parts[0] && parts[0].startsWith("@")) {
      branch = parts.shift().slice(1);
    } else {
      branch = "pages";
    }

    filePath = parts.join("/") || "index.html";
  }

  // Normalizar ruta: si termina en / agregar index.html
  if (filePath.endsWith("/") || filePath === "") filePath += "index.html";

  // ── 2. Construir URL del archivo raw y pedirla via proxy ──────

  const apiBase = CONFIG.instance.replace(/\/$/, "");
  const rawUrl  = `${apiBase}/${encodeURIComponent(user)}/${encodeURIComponent(repo)}/raw/branch/${encodeURIComponent(branch)}/${filePath}`;

  // Verificar que el repo exista primero (da mejor mensaje de error)
  const repoCheckUrl = `${apiBase}/api/v1/repos/${encodeURIComponent(user)}/${encodeURIComponent(repo)}`;
  const repoProxy    = proxy(repoCheckUrl);

  let repoRes;
  try {
    repoRes = await fetch(repoProxy);
  } catch (e) {
    return err(502, "No se pudo conectar a la instancia", apiBase);
  }

  if (repoRes.status === 404) return err(404, "Repositorio no encontrado", `${user}/${repo}`);
  if (repoRes.status === 401 || repoRes.status === 403) return err(403, "Acceso denegado", `${user}/${repo}`);
  if (!repoRes.ok) return err(repoRes.status, "Error al acceder al repositorio", repoCheckUrl);

  // Ahora buscar el archivo
  const fileProxy = proxy(rawUrl);
  let fileRes;
  try {
    fileRes = await fetch(fileProxy);
  } catch (e) {
    return err(502, "No se pudo cargar la página", rawUrl);
  }

  if (fileRes.status === 404) return err(404, "Página no encontrada", `${repo}@${branch}/${filePath}`);
  if (!fileRes.ok) return err(fileRes.status, "No se pudo cargar la página", rawUrl);

  // ── 3. Servir el contenido ────────────────────────────────────

  const contentType = fileRes.headers.get("content-type") || guessType(filePath);
  const blob        = await fileRes.blob();

  if (isText(contentType, filePath)) {
    const text = await blob.text();
    if (contentType.includes("text/html") || /\.html?$/.test(filePath)) {
      // Reescribir rutas relativas con <base> e inyectar y servir
      const baseHref = `${apiBase}/${encodeURIComponent(user)}/${encodeURIComponent(repo)}/raw/branch/${encodeURIComponent(branch)}/`;
      const dir      = filePath.includes("/") ? filePath.slice(0, filePath.lastIndexOf("/") + 1) : "";
      const withBase = text.replace(/(<head[^>]*>)/i, `$1\n<base href="${baseHref}${dir}">`);
      document.open();
      document.write(withBase);
      document.close();
    } else {
      document.open();
      document.write(`<pre style="font:0.9rem 'Courier New',monospace;white-space:pre-wrap;padding:1.5rem">${esc(text)}</pre>`);
      document.close();
    }
  } else {
    // Binarios (imágenes, video, pdf…): crear object URL y redirigir
    location.replace(URL.createObjectURL(blob));
  }

})();

// ── Utilidades ────────────────────────────────────────────────────

/** Construye la URL del proxy local evitando CORS */
function proxy(targetUrl) {
  const params = new URLSearchParams({ url: targetUrl });
  if (CONFIG.token && CONFIG.token.toLowerCase() !== "no") {
    params.set("token", CONFIG.token);
  }
  return `/_proxy?${params.toString()}`;
}

function guessType(path) {
  const ext = path.split(".").pop().toLowerCase();
  const map = {
    html:"text/html", htm:"text/html",
    css:"text/css", js:"application/javascript",
    json:"application/json", txt:"text/plain",
    md:"text/plain", svg:"image/svg+xml",
    png:"image/png", jpg:"image/jpeg", jpeg:"image/jpeg",
    gif:"image/gif", webp:"image/webp", ico:"image/x-icon",
    mp4:"video/mp4", webm:"video/webm",
    mp3:"audio/mpeg", ogg:"audio/ogg",
    pdf:"application/pdf",
    woff:"font/woff", woff2:"font/woff2", ttf:"font/ttf",
  };
  return map[ext] || "application/octet-stream";
}

function isText(ct, path) {
  return ct.startsWith("text/") || ct.includes("javascript") ||
         ct.includes("json")    || ct.includes("svg") || /\.md$/.test(path);
}

function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function err(code, message, detail) {
  const labels = { 400:"Bad Request", 401:"Unauthorized", 403:"Forbidden", 404:"Not Found", 502:"Bad Gateway" };
  document.body.className = "error-view";
  document.body.innerHTML = `
    <div class="error-box">
      <div class="code">${code}</div>
      <div class="label">${labels[code] || "Error"}</div>
      <div class="message">${esc(message)}</div>
      ${detail ? `<div class="detail">${esc(String(detail))}</div>` : ""}
    </div>`;
}
</script>
</body>
</html>
