<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pages</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* ── Error view ── */
  body.error-view {
    font-family: 'Courier New', monospace;
    background: #0e0e0e;
    color: #e0e0e0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 2rem;
  }
  .error-box { max-width: 480px; width: 100%; border: 1px solid #2a2a2a; padding: 2rem 2.5rem; }
  .error-box .code { font-size: 4rem; font-weight: bold; color: #fff; line-height: 1; margin-bottom: 0.4rem; }
  .error-box .label { font-size: 0.7rem; letter-spacing: 0.18em; text-transform: uppercase; color: #555; margin-bottom: 1.5rem; }
  .error-box .message { font-size: 0.88rem; color: #999; line-height: 1.65; }
  .error-box .detail { margin-top: 1rem; font-size: 0.72rem; color: #444; word-break: break-all; line-height: 1.5; }

  /* ── Home view ── */
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=IBM+Plex+Sans:wght@300;400&display=swap');

  body.home-view {
    font-family: 'IBM Plex Mono', 'Courier New', monospace;
    background: #080808;
    color: #c8c8c8;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    overflow: hidden;
  }

  body.home-view::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      repeating-linear-gradient(
        0deg,
        transparent,
        transparent 39px,
        rgba(255,255,255,0.018) 39px,
        rgba(255,255,255,0.018) 40px
      ),
      repeating-linear-gradient(
        90deg,
        transparent,
        transparent 39px,
        rgba(255,255,255,0.018) 39px,
        rgba(255,255,255,0.018) 40px
      );
    pointer-events: none;
    z-index: 0;
  }

  .home-wrap {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 520px;
    animation: fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Header */
  .home-header {
    margin-bottom: 2.8rem;
  }

  .home-logo {
    display: flex;
    align-items: baseline;
    gap: 0.6rem;
    margin-bottom: 0.5rem;
  }

  .home-logo-mark {
    font-size: 0.65rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #3a3a3a;
    font-weight: 400;
    padding: 0.18rem 0.45rem;
    border: 1px solid #1e1e1e;
  }

  .home-title {
    font-size: 1.65rem;
    font-weight: 600;
    color: #f0f0f0;
    letter-spacing: -0.02em;
    line-height: 1;
  }

  .home-subtitle {
    font-size: 0.72rem;
    color: #3a3a3a;
    letter-spacing: 0.06em;
    margin-top: 0.6rem;
    font-weight: 300;
  }

  /* Form */
  .home-form {
    display: flex;
    flex-direction: column;
    gap: 0;
    border: 1px solid #1c1c1c;
  }

  .field-row {
    display: flex;
    align-items: stretch;
    border-bottom: 1px solid #1c1c1c;
    position: relative;
    transition: background 0.15s;
  }
  .field-row:last-of-type { border-bottom: none; }
  .field-row:focus-within { background: #0f0f0f; }

  .field-label {
    display: flex;
    align-items: center;
    padding: 0 1rem;
    min-width: 90px;
    font-size: 0.62rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #2e2e2e;
    border-right: 1px solid #1c1c1c;
    user-select: none;
    transition: color 0.15s;
    font-weight: 500;
  }
  .field-row:focus-within .field-label { color: #555; }

  .field-optional {
    font-size: 0.5rem;
    letter-spacing: 0.1em;
    color: #252525;
    display: block;
    margin-top: 2px;
    font-weight: 300;
  }
  .field-row:focus-within .field-optional { color: #3a3a3a; }

  .field-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    padding: 0.9rem 1rem;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.82rem;
    color: #e0e0e0;
    caret-color: #7fff7f;
    letter-spacing: 0.01em;
  }
  .field-input::placeholder {
    color: #222;
    font-weight: 300;
  }
  .field-input:focus::placeholder { color: #2e2e2e; }

  /* Preview bar */
  .home-preview {
    margin-top: 1px;
    padding: 0.6rem 1rem;
    font-size: 0.66rem;
    color: #282828;
    letter-spacing: 0.04em;
    min-height: 2rem;
    display: flex;
    align-items: center;
    gap: 0.3rem;
    transition: color 0.2s;
    border: 1px solid #1c1c1c;
    border-top: none;
  }
  .home-preview.active { color: #404040; }
  .home-preview .preview-arrow { color: #1e1e1e; }
  .home-preview.active .preview-arrow { color: #3a3a3a; }
  .home-preview .preview-url { color: #4a8a4a; font-weight: 400; }

  /* Submit button */
  .home-submit {
    margin-top: 1.4rem;
    width: 100%;
    padding: 0.85rem;
    background: #111;
    border: 1px solid #252525;
    color: #888;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
    font-weight: 400;
    position: relative;
    overflow: hidden;
  }
  .home-submit::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.015) 50%, transparent 100%);
    transform: translateX(-100%);
    transition: transform 0.4s;
  }
  .home-submit:hover::before { transform: translateX(100%); }
  .home-submit:hover { border-color: #3a3a3a; color: #bbb; background: #131313; }
  .home-submit:active { background: #0a0a0a; }
  .home-submit:disabled { opacity: 0.3; cursor: not-allowed; }

  /* Footer note */
  .home-note {
    margin-top: 2rem;
    font-size: 0.6rem;
    color: #202020;
    letter-spacing: 0.1em;
    text-align: center;
    line-height: 1.8;
  }
  .home-note span { color: #2a2a2a; }
</style>
</head>
<body>
<script>
/* ================================================================
   PAGES — Gitea/Forgejo static hosting via Cloudflare Pages
   ================================================================ */

const CONFIG = {
  domain:   "luciano.qzz.io",
  instance: "https://git.luciano.qzz.io",
  token:    "no",
  mode:     "slash",   // "sub" | "slash"
};

/* ================================================================
   MOTOR
   ================================================================ */

(async () => {
  const host      = location.hostname;
  const pathname  = location.pathname;
  const cfgDomain = CONFIG.domain.replace(/^https?:\/\//, "").replace(/\/$/, "");

  // ── Root: mostrar landing page ────────────────────────────────
  const isRoot = (CONFIG.mode === "sub" && host === cfgDomain)
              || (CONFIG.mode === "slash" && host === cfgDomain && (pathname === "/" || pathname === ""));

  if (isRoot) {
    return showHome(cfgDomain);
  }

  // ── 1. Parsear usuario, repo, rama y ruta ─────────────────────

  let user, repo, branch, filePath;

  if (CONFIG.mode === "sub") {
    if (!host.endsWith(cfgDomain)) return err(400, "Dominio no reconocido", host);

    user = host.slice(0, host.length - cfgDomain.length - 1);

    const parts = pathname.replace(/^\//, "").split("/").filter(Boolean);

    if (parts.length === 0) {
      repo = user; branch = "pages"; filePath = "index.html";
    } else if (parts[0].startsWith("@")) {
      repo = user; branch = parts.shift().slice(1);
      filePath = parts.join("/") || "index.html";
    } else {
      repo = parts.shift();
      branch = (parts[0] && parts[0].startsWith("@")) ? parts.shift().slice(1) : "pages";
      filePath = parts.join("/") || "index.html";
    }

  } else {
    if (host !== cfgDomain) return err(400, "Dominio no reconocido", host);

    const parts = pathname.replace(/^\//, "").split("/").filter(Boolean);

    if (!parts[0]) return err(404, "No se especificó un usuario", pathname);
    user = parts.shift();

    if (!parts[0] || parts[0].startsWith("@")) {
      repo = user;
    } else {
      repo = parts.shift();
    }

    branch = (parts[0] && parts[0].startsWith("@")) ? parts.shift().slice(1) : "pages";
    filePath = parts.join("/") || "index.html";
  }

  if (filePath.endsWith("/") || filePath === "") filePath += "index.html";

  // ── 2. Verificar repo y obtener archivo via proxy ─────────────

  const apiBase = CONFIG.instance.replace(/\/$/, "");

  const repoRes = await safeFetch(proxy(`${apiBase}/api/v1/repos/${enc(user)}/${enc(repo)}`));
  if (!repoRes) return err(502, "No se pudo conectar a la instancia", apiBase);
  if (repoRes.status === 404) return err(404, "Repositorio no encontrado", `${user}/${repo}`);
  if (repoRes.status === 401 || repoRes.status === 403) return err(403, "Acceso denegado", `${user}/${repo}`);
  if (!repoRes.ok) return err(repoRes.status, "Error al acceder al repositorio");

  const rawUrl  = `${apiBase}/${enc(user)}/${enc(repo)}/raw/branch/${enc(branch)}/${filePath}`;
  const fileRes = await safeFetch(proxy(rawUrl));
  if (!fileRes) return err(502, "No se pudo cargar la página", rawUrl);
  if (fileRes.status === 404) return err(404, "Página no encontrada", `${repo}@${branch}/${filePath}`);
  if (!fileRes.ok) return err(fileRes.status, "No se pudo cargar la página", rawUrl);

  // ── 3. Servir el contenido ────────────────────────────────────

  const contentType = fileRes.headers.get("content-type") || guessType(filePath);
  const blob        = await fileRes.blob();

  if (isText(contentType, filePath)) {
    const text = await blob.text();

    if (contentType.includes("text/html") || /\.html?$/.test(filePath)) {
      const dir      = filePath.includes("/") ? filePath.slice(0, filePath.lastIndexOf("/") + 1) : "";
      const baseHref = `${apiBase}/${enc(user)}/${enc(repo)}/raw/branch/${enc(branch)}/${dir}`;

      const interceptor = `<script>
(function(){
  var BASE  = ${JSON.stringify(apiBase)};
  var TOKEN = ${JSON.stringify(CONFIG.token)};
  var PFULL = ${JSON.stringify(baseHref)};

  function toProxy(url) {
    try {
      var abs = /^https?:\/\//i.test(url)
        ? url
        : new URL(url, PFULL).toString();
      if (!abs.startsWith(BASE)) return url;
      var p = new URLSearchParams({ url: abs });
      if (TOKEN && TOKEN.toLowerCase() !== "no") p.set("token", TOKEN);
      return "/_proxy?" + p.toString();
    } catch(e) { return url; }
  }

  var _oF = window.fetch;
  window.fetch = function(input, init) {
    if (typeof input === "string") input = toProxy(input);
    else if (input instanceof Request) input = new Request(toProxy(input.url), input);
    return _oF.call(this, input, init);
  };

  var _oO = XMLHttpRequest.prototype.open;
  XMLHttpRequest.prototype.open = function() {
    var a = Array.prototype.slice.call(arguments);
    if (typeof a[1] === "string") a[1] = toProxy(a[1]);
    return _oO.apply(this, a);
  };
})();
<\/script>`;

      const withBase = text.replace(/(<head[^>]*>)/i,
        `$1\n<base href="${baseHref}">\n${interceptor}`);

      document.open();
      document.write(withBase);
      document.close();

    } else {
      document.open();
      document.write(`<pre style="font:0.9rem 'Courier New',monospace;white-space:pre-wrap;padding:1.5rem">${esc(text)}</pre>`);
      document.close();
    }

  } else {
    location.replace(URL.createObjectURL(blob));
  }

})();

// ── Landing page ──────────────────────────────────────────────────

function showHome(cfgDomain) {
  document.body.className = "home-view";
  document.body.innerHTML = `
    <div class="home-wrap">
      <div class="home-header">
        <div class="home-logo">
          <span class="home-logo-mark">static</span>
          <span class="home-title">Pages</span>
        </div>
        <div class="home-subtitle">${esc(cfgDomain)}</div>
      </div>

      <div class="home-form" id="homeForm">
        <div class="field-row">
          <label class="field-label" for="inp-user">User</label>
          <input class="field-input" id="inp-user" type="text" placeholder="username" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        </div>
        <div class="field-row">
          <label class="field-label" for="inp-repo">Repo</label>
          <input class="field-input" id="inp-repo" type="text" placeholder="repository" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        </div>
        <div class="field-row" style="border-bottom:none">
          <label class="field-label" for="inp-branch">
            Branch
            <span class="field-optional">optional</span>
          </label>
          <input class="field-input" id="inp-branch" type="text" placeholder="pages" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        </div>
      </div>

      <div class="home-preview" id="homePreview">
        <span class="preview-arrow">→</span>
        <span id="previewUrl">—</span>
      </div>

      <button class="home-submit" id="homeSubmit" disabled>Go →</button>

      <div class="home-note">
        branch defaults to <span>pages</span> when left empty<br>
        powered by Gitea / Forgejo
      </div>
    </div>
  `;

  const inpUser   = document.getElementById('inp-user');
  const inpRepo   = document.getElementById('inp-repo');
  const inpBranch = document.getElementById('inp-branch');
  const preview   = document.getElementById('homePreview');
  const previewUrl= document.getElementById('previewUrl');
  const submit    = document.getElementById('homeSubmit');

  function buildUrl() {
    const user   = inpUser.value.trim();
    const repo   = inpRepo.value.trim();
    const branch = inpBranch.value.trim();
    if (!user) return null;

    const proto = location.protocol + "//";

    if (CONFIG.mode === "sub") {
      // user.domain/repo/@branch  OR  user.domain (if repo === user)
      const repoSeg = (repo && repo !== user) ? `/${repo}` : "";
      const branchSeg = branch ? `/@${branch}` : "";
      return `${proto}${user}.${cfgDomain}${repoSeg}${branchSeg}/`;
    } else {
      // domain/user/repo/@branch
      const repoSeg = repo ? `/${repo}` : "";
      const branchSeg = branch ? `/@${branch}` : "";
      return `${proto}${cfgDomain}/${user}${repoSeg}${branchSeg}/`;
    }
  }

  function update() {
    const url = buildUrl();
    if (url) {
      previewUrl.textContent = url;
      previewUrl.className = "preview-url";
      preview.className = "home-preview active";
      submit.disabled = false;
    } else {
      previewUrl.textContent = "—";
      previewUrl.className = "";
      preview.className = "home-preview";
      submit.disabled = true;
    }
  }

  function go() {
    const url = buildUrl();
    if (url) location.href = url;
  }

  [inpUser, inpRepo, inpBranch].forEach(el => el.addEventListener('input', update));

  [inpUser, inpRepo, inpBranch].forEach(el => el.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const url = buildUrl();
      if (url) go();
    }
  }));

  submit.addEventListener('click', go);

  // Auto-focus
  inpUser.focus();
}

// ── Utilidades ────────────────────────────────────────────────────

function proxy(targetUrl) {
  const p = new URLSearchParams({ url: targetUrl });
  if (CONFIG.token && CONFIG.token.toLowerCase() !== "no") p.set("token", CONFIG.token);
  return `/_proxy?${p.toString()}`;
}

async function safeFetch(url) {
  try { return await fetch(url); } catch(e) { return null; }
}

function enc(s) { return encodeURIComponent(s); }

function guessType(path) {
  const ext = path.split(".").pop().toLowerCase();
  return ({
    html:"text/html", htm:"text/html", css:"text/css",
    js:"application/javascript", json:"application/json",
    txt:"text/plain", md:"text/plain", svg:"image/svg+xml",
    png:"image/png", jpg:"image/jpeg", jpeg:"image/jpeg",
    gif:"image/gif", webp:"image/webp", ico:"image/x-icon",
    mp4:"video/mp4", webm:"video/webm", mp3:"audio/mpeg",
    ogg:"audio/ogg", pdf:"application/pdf",
    woff:"font/woff", woff2:"font/woff2", ttf:"font/ttf",
  })[ext] || "application/octet-stream";
}

function isText(ct, path) {
  return ct.startsWith("text/") || ct.includes("javascript") ||
         ct.includes("json")    || ct.includes("svg") || /\.md$/.test(path);
}

function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function err(code, message, detail) {
  const labels = { 400:"Bad Request", 401:"Unauthorized", 403:"Forbidden", 404:"Not Found", 502:"Bad Gateway" };
  document.body.className = "error-view";
  document.body.innerHTML = `
    <div class="error-box">
      <div class="code">${code}</div>
      <div class="label">${labels[code] || "Error"}</div>
      <div class="message">${esc(message)}</div>
      ${detail ? `<div class="detail">${esc(String(detail))}</div>` : ""}
    </div>`;
}
</script>
</body>
</html>
